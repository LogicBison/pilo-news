name: ${COMPOSE_PROJECT_NAME:-system-news-prd}

# Production runs behind the host's nginx (TLS + routing in ops/nginx/). Compose
# only publishes loopback ports for that proxy; nothing is exposed directly.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    networks: [data]
    restart: unless-stopped
    env_file: .env.prd
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news}
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    logging: *logging

  redis:
    image: redis:7-alpine
    networks: [data]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-redis}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis} ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 256m
    logging: *logging

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prd
    networks: [default, data]
    restart: unless-stopped
    env_file: .env.prd
    environment:
      FORWARDED_ALLOW_IPS: "*"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    tmpfs:
      - /tmp
    logging: *logging

  worker:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prd
    networks: [default, data]
    restart: unless-stopped
    env_file: .env.prd
    command: ["python", "-m", "news_api.worker"]
    # The image's healthcheck probes :8080, which only the API serves; without
    # this the worker is reported unhealthy while doing its job normally.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 512m
    logging: *logging

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.prd
    networks: [default]
    restart: unless-stopped
    env_file: .env.prd
    environment:
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    tmpfs:
      - /tmp
    logging: *logging

volumes:
  pgdata:
  redisdata:
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-system-news-prd}-net
    driver: bridge
  data:
    name: ${COMPOSE_PROJECT_NAME:-system-news-prd}-data
    driver: bridge
    internal: true

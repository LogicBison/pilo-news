name: ${COMPOSE_PROJECT_NAME:-system-news-dev}

# Bound the docker log files: a dev day of Next.js compiles and API traffic
# should not be able to fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    networks: [data]
    env_file: .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-news}
      POSTGRES_USER: ${POSTGRES_USER:-news}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-news}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-news} -d ${POSTGRES_DB:-news}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    logging: *logging
    image: redis:7-alpine
    networks: [data]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    logging: *logging
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    networks: [default, data]
    env_file: .env.dev
    # No access log: the structured middleware already reports failures and
    # slow requests, and uvicorn would print every probe twice.
    command: ["uvicorn", "news_api.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload", "--no-access-log"]
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    logging: *logging
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    networks: [default, data]
    env_file: .env.dev
    command: ["python", "-m", "news_api.worker"]
    volumes:
      - ./apps/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    logging: *logging
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    networks: [default]
    env_file: .env.dev
    environment:
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:8080}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8080}
    command: ["pnpm", "dev"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules_v2:/app/node_modules
      - web_next_v2:/app/.next
      - web_playwright_cache:/root/.cache/ms-playwright
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  web_node_modules_v2:
  web_next_v2:
  web_playwright_cache:
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-system-news-dev}-net
    driver: bridge
  data:
    name: ${COMPOSE_PROJECT_NAME:-system-news-dev}-data
    driver: bridge
    internal: true
